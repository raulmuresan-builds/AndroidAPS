# -----------------------------------------------------------------------------
# AAPS pentru clienti - raulmuresan-builds
#
# Ia tag-ul oficial AAPS, semneaza cu keystore-ul existent si urca in Google Drive:
#   variant=master: aplica protectie/ (activare legata de telefon), fullRelease
#                   -> AAPS Clienti/Master/<versiune>/aaps-<versiune>-protejat.apk
#   variant=client: AAPSClient standard (aapsclientRelease), fara protectie
#                   -> AAPS Clienti/Client/<versiune>/aapsclient-<versiune>.apk
#   variant=rapid:  ca master + obiectivele 0-9 indeplinite la prima pornire
#                   -> AAPS Rapid/<versiune>/aaps-<versiune>-rapid.apk (folder nepartajat)
# Fisier separat de workflow-urile oficiale AAPS, ca "Sync fork" sa nu dea conflicte.
# Secrete: KEYSTORE_SET (sau cele 4 separate), GDRIVE_OAUTH2, AAPS_ACTIVATION_SECRET.
# -----------------------------------------------------------------------------

name: AAPS Master protejat

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Versiunea AAPS oficiala (tag), ex. 4.0.0'
        required: true
        default: '4.0.0'
        type: string
      variant:
        description: 'Ce se construieste'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - client
          - rapid

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.variant }} ${{ inputs.tagName }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tagName }}
      VARIANT: ${{ inputs.variant }}
    steps:
      - name: Decodeaza secretele
        env:
          S_KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          S_GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
        run: |
          DELIM="AAPS_EOF_$(openssl rand -hex 16)"
          emit() { printf '%s<<%s\n%s\n%s\n' "$1" "$DELIM" "$2" "$DELIM" >> "$GITHUB_ENV"; }
          emit_masked() { echo "::add-mask::$2"; emit "$1" "$2"; }
          if [ -n "$S_KEYSTORE_SET" ]; then
            DECODED=$(printf '%s' "$S_KEYSTORE_SET" | base64 -d)
            emit_masked KEYSTORE_BASE64   "$(printf '%s' "$DECODED" | cut -d'|' -f1)"
            emit_masked KEYSTORE_PASSWORD "$(printf '%s' "$DECODED" | cut -d'|' -f2)"
            emit_masked KEY_ALIAS         "$(printf '%s' "$DECODED" | cut -d'|' -f3)"
            emit_masked KEY_PASSWORD      "$(printf '%s' "$DECODED" | cut -d'|' -f4)"
          else
            emit KEYSTORE_BASE64   "$S_KEYSTORE_BASE64"
            emit KEYSTORE_PASSWORD "$S_KEYSTORE_PASSWORD"
            emit KEY_ALIAS         "$S_KEY_ALIAS"
            emit KEY_PASSWORD      "$S_KEY_PASSWORD"
          fi
          G=$(printf '%s' "$S_GDRIVE_OAUTH2" | base64 -d)
          emit_masked GDRIVE_CLIENT_ID     "$(printf '%s' "$G" | cut -d'|' -f1)"
          emit_masked GDRIVE_REFRESH_TOKEN "$(printf '%s' "$G" | cut -d'|' -f2)"

      - name: Verifica secretele
        env:
          ACTIVATION_SECRET: ${{ secrets.AAPS_ACTIVATION_SECRET }}
        run: |
          M=0
          for V in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GDRIVE_CLIENT_ID GDRIVE_REFRESH_TOKEN ACTIVATION_SECRET; do
            if [ -z "${!V}" ]; then echo "::error::Lipseste: $V"; M=1; fi
          done
          [ "$M" -eq 0 ] || exit 1
          echo "Toate secretele sunt prezente."

      - name: Decodeaza keystore-ul
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Acces Google Drive
        run: |
          AT=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$GDRIVE_CLIENT_ID" -d refresh_token="$GDRIVE_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          [ -n "$AT" ] && [ "$AT" != "null" ] || { echo "::error::Nu s-a putut obtine accesul la Google Drive."; exit 1; }
          echo "ACCESS_TOKEN=$AT" >> "$GITHUB_ENV"

      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pastreaza protectia si harta JDK inainte de tag
        run: |
          cp -r protectie "$RUNNER_TEMP/protectie"
          cp .github/jdk-map.json "$RUNNER_TEMP/jdk-map.json"

      - name: Descarca tag-ul oficial
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true
          git fetch upstream "refs/tags/$TAG:refs/tags/$TAG"

      - name: Alege JDK dupa tag
        run: |
          JAVA_VERSION=$(jq -r '.default' "$RUNNER_TEMP/jdk-map.json")
          while IFS=$'\t' read -r pattern jdk; do
            if [[ "$TAG" == $pattern ]]; then JAVA_VERSION="$jdk"; break; fi
          done < <(jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' "$RUNNER_TEMP/jdk-map.json")
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"
          echo "Tag $TAG -> JDK $JAVA_VERSION"

      - name: Treci pe tag-ul oficial
        run: git checkout "refs/tags/$TAG"

      - name: Aplica protectia (Master si Rapid)
        if: inputs.variant == 'master' || inputs.variant == 'rapid'
        env:
          ACTIVATION_SECRET: ${{ secrets.AAPS_ACTIVATION_SECRET }}
        run: |
          EXTRA=""; [ "$VARIANT" = "rapid" ] && EXTRA="--rapid"
          python3 "$RUNNER_TEMP/protectie/aplica_protectie.py" "$RUNNER_TEMP/protectie" $EXTRA
          # AAPS refuza build-ul cu modificari necomise: le comitem local (doar pe runner, nu se urca nicaieri).
          git add -A app/src/main plugins/constraints/src
          git -c user.name="raulmuresan-builds" -c user.email="builds@localhost" commit -q -m "Activare raulmuresan-builds (local, la build)"
          git status --short | head -5

      - name: Versiunea
        run: |
          VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          [ -n "$VERSION" ] || VERSION="$TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versiune: $VERSION"

      - name: JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Construieste APK-ul
        run: |
          if [ "$VARIANT" = "master" ]; then
            TASK=":app:assembleFullRelease"; OUT="app/build/outputs/apk/full/release"; NAME="aaps-${VERSION}-protejat.apk"
          elif [ "$VARIANT" = "rapid" ]; then
            TASK=":app:assembleFullRelease"; OUT="app/build/outputs/apk/full/release"; NAME="aaps-${VERSION}-rapid.apk"
          else
            TASK=":app:assembleAapsclientRelease"; OUT="app/build/outputs/apk/aapsclient/release"; NAME="aapsclient-${VERSION}.apk"
          fi
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew $TASK \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss4m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mv $OUT/*.apk "$NAME"
          ls -l "$NAME"

      - name: Urca in Google Drive (AAPS Clienti/<Master|Client> sau AAPS Rapid)
        run: |
          API=https://www.googleapis.com/drive/v3/files
          FOLDER="mimeType='application/vnd.google-apps.folder' and trashed=false"
          find_or_create() { # $1=nume $2=parinte
            local ID=$(curl -s -G -H "Authorization: Bearer $ACCESS_TOKEN" \
              --data-urlencode "q=name='$1' and '$2' in parents and $FOLDER" --data-urlencode "fields=files(id)" $API | jq -r '.files[0].id')
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              ID=$(curl -s -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
                -d "{\"name\":\"$1\",\"mimeType\":\"application/vnd.google-apps.folder\",\"parents\":[\"$2\"]}" $API | jq -r .id)
            fi
            echo "$ID"
          }
          if [ "$VARIANT" = "rapid" ]; then
            PARENT=$(find_or_create "AAPS Rapid" "root"); WHERE="AAPS Rapid"
          else
            ROOT=$(find_or_create "AAPS Clienti" "root")
            if [ "$VARIANT" = "master" ]; then SUB="Master"; else SUB="Client"; fi
            PARENT=$(find_or_create "$SUB" "$ROOT"); WHERE="AAPS Clienti/$SUB"
          fi
          VER=$(find_or_create "$VERSION" "$PARENT")
          NAME="$APK_NAME"
          OLD=$(curl -s -G -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=name='$NAME' and '$VER' in parents and trashed=false" --data-urlencode "fields=files(id)" $API | jq -r '.files[0].id')
          if [ -n "$OLD" ] && [ "$OLD" != "null" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d '{"trashed":true}' "$API/$OLD" > /dev/null
            echo "Fisierul vechi cu acelasi nume a fost mutat in Cos."
          fi
          CODE=$(curl -s -o resp.json -w "%{http_code}" -X POST -H "Authorization: Bearer $ACCESS_TOKEN" \
            -F "metadata={\"name\":\"$NAME\",\"parents\":[\"$VER\"]};type=application/json;charset=UTF-8" \
            -F "file=@$NAME;type=application/vnd.android.package-archive" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart")
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then echo "::error::Upload esuat ($CODE)"; cat resp.json; exit 1; fi
          echo "Urcat: $WHERE/$VERSION/$NAME"
