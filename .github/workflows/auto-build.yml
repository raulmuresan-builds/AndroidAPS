# -----------------------------------------------------------------------------
# Auto Build (AAPS Master protejat + AAPSClient + xDrip+) - raulmuresan-builds
#
# Ruleaza zilnic noaptea. Construieste DOAR cand apare o versiune oficiala noua.
# Totul ajunge in Google Drive, in folderul partajat cu oamenii:
#   - AAPS Master protejat (activare legata de telefon) -> AAPS Aplicații/Master/<versiune>/
#   - AAPSClient (standard)                             -> AAPS Aplicații/Client/<versiune>/
#   - AAPS Setup (obiective indeplinite, nepartajat)    -> AAPS Setup/<versiune>/
#   - xDrip+ (doar versiuni stabile, APK oficial)       -> AAPS Aplicații/xDrip/<versiune>/
# Nu se mai construieste niciun AAPS neprotejat.
# Pastreaza ultimele 3 versiuni din fiecare; cele mai vechi sunt mutate in Cosul
# de gunoi din Google Drive (recuperabile 30 de zile).
#
# Build-urile AAPS se fac prin aaps-protejat.yml (variant=master / variant=client).
# Fisier separat de workflow-urile oficiale AAPS, ca "Sync fork" sa nu dea conflicte.
# Foloseste secretele: GH_PAT (organizatie), GDRIVE_OAUTH2 (repo).
# Variabile scrise automat: AAPS_LAST_BUILT, XDRIP_LAST_BUILT.
# -----------------------------------------------------------------------------

name: Auto Build (AAPS + xDrip)

on:
  schedule:
    - cron: "17 1 * * *"   # 03:17 ora Romaniei iarna (04:17 vara)
  workflow_dispatch:
    inputs:
      xdrip_fortat:
        description: 'Urca din nou ultimul xDrip+ chiar daca a mai fost salvat'
        type: boolean
        default: false

concurrency:
  group: auto-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  REPO: ${{ github.repository }}
  GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
  KEEP: "3"
  DEST: "AAPS Aplicații"

jobs:
  aaps:
    name: AAPS Master protejat + AAPSClient
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LAST: ${{ vars.AAPS_LAST_BUILT }}
    steps:
      - name: Keepalive (programarea nu se opreste dupa 60 de zile)
        run: gh api -X PUT "repos/$REPO/actions/workflows/auto-build.yml/enable" || true

      - name: Verifica ultima versiune oficiala AAPS
        id: check
        run: |
          LATEST=$(gh api repos/nightscout/AndroidAPS/releases/latest --jq .tag_name)
          echo "Ultima versiune oficiala: $LATEST | ultima construita: ${LAST:-niciuna}"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$LAST" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Nimic nou - nu se construieste nimic."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizeaza fork-ul (master) cu AAPS oficial
        if: steps.check.outputs.new == 'true'
        run: gh api -X POST "repos/$REPO/merge-upstream" -f branch=master

      - name: Construieste Master protejat, AAPSClient si Setup (asteapta finalizarea)
        if: steps.check.outputs.new == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          sleep 10
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for V in master client setup; do
            gh workflow run aaps-protejat.yml -R "$REPO" --ref master -f tagName="$LATEST" -f variant="$V"
            echo "Pornit: $LATEST $V"
            sleep 10
          done
          sleep 30
          IDS=$(gh run list -R "$REPO" --workflow aaps-protejat.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$START\") | .databaseId] | .[]")
          COUNT=$(printf '%s\n' "$IDS" | grep -c . || true)
          if [ "$COUNT" -lt 3 ]; then echo "::error::Nu au pornit toate cele 3 build-uri (gasite: $COUNT)."; exit 1; fi
          for ID in $IDS; do
            echo "Astept build-ul $ID ..."
            gh run watch "$ID" -R "$REPO" --exit-status --interval 60 > /dev/null
            echo "Build $ID reusit."
          done

      - name: Memoreaza versiunea construita
        if: steps.check.outputs.new == 'true'
        run: gh variable set AAPS_LAST_BUILT -R "$REPO" --body "${{ steps.check.outputs.latest }}"

      - name: Pastreaza doar ultimele 3 versiuni Master, Client si Setup
        if: steps.check.outputs.new == 'true'
        run: |
          DECODED=$(echo "$GDRIVE_OAUTH2" | base64 -d)
          CID=$(echo "$DECODED" | cut -d'|' -f1); RT=$(echo "$DECODED" | cut -d'|' -f2)
          echo "::add-mask::$CID"; echo "::add-mask::$RT"
          AT=$(curl -s -X POST https://oauth2.googleapis.com/token -d client_id="$CID" -d refresh_token="$RT" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          API=https://www.googleapis.com/drive/v3/files
          FOLDER="mimeType='application/vnd.google-apps.folder' and trashed=false"
          ROOT=$(curl -s -G -H "Authorization: Bearer $AT" --data-urlencode "q=name='$DEST' and 'root' in parents and $FOLDER" --data-urlencode "fields=files(id)" $API | jq -r '.files[0].id')
          for SUB in Master Client Setup; do
            if [ "$SUB" = "Setup" ]; then
              PID=$(curl -s -G -H "Authorization: Bearer $AT" --data-urlencode "q=name='AAPS Setup' and 'root' in parents and $FOLDER" --data-urlencode "fields=files(id)" $API | jq -r '.files[0].id')
            else
              [ -n "$ROOT" ] && [ "$ROOT" != "null" ] || continue
              PID=$(curl -s -G -H "Authorization: Bearer $AT" --data-urlencode "q=name='$SUB' and '$ROOT' in parents and $FOLDER" --data-urlencode "fields=files(id)" $API | jq -r '.files[0].id')
            fi
            [ -n "$PID" ] && [ "$PID" != "null" ] || continue
            curl -s -G -H "Authorization: Bearer $AT" \
              --data-urlencode "q='$PID' in parents and $FOLDER" \
              --data-urlencode "fields=files(id,name,createdTime)" --data-urlencode "orderBy=createdTime desc" \
              $API > folders.json
            jq -r '.files[] | .name' folders.json | sed "s|^|Gasit: $DEST/$SUB/|"
            jq -r --argjson k "$KEEP" '.files[$k:][] | "\(.id) \(.name)"' folders.json | while read -r ID NAME; do
              curl -s -X PATCH -H "Authorization: Bearer $AT" -H "Content-Type: application/json" -d '{"trashed":true}' "$API/$ID" > /dev/null
              echo "Mutat in Cosul de gunoi: $DEST/$SUB/$NAME"
            done
          done

  xdrip:
    name: xDrip+ (doar versiuni stabile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAST: ${{ vars.XDRIP_LAST_BUILT }}
    steps:
      - name: Verifica ultima versiune stabila xDrip+
        id: check
        run: |
          LATEST=$(gh api repos/NightscoutFoundation/xDrip/releases/latest --jq .tag_name)
          echo "Ultima versiune stabila xDrip+: $LATEST | ultima salvata: ${LAST:-niciuna}"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$LAST" ] && [ "${{ inputs.xdrip_fortat }}" != "true" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "Nimic nou."; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Descarca APK-ul oficial si urca-l in Google Drive (AAPS Aplicații/xDrip/<versiune>)
        if: steps.check.outputs.new == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          URL=$(gh api "repos/NightscoutFoundation/xDrip/releases/tags/$LATEST" --jq '.assets[] | select(.name|test("^xDrip-plus-[0-9]+-[0-9a-f]+\\.apk$")) | .browser_download_url' | head -1)
          [ -n "$URL" ] || { echo "::error::Nu am gasit APK-ul principal xDrip+ pentru $LATEST."; exit 1; }
          NAME=$(basename "$URL")
          curl -fsSL -o "$NAME" "$URL"
          echo "Descarcat: $NAME ($(stat -c %s "$NAME") bytes)"
          DECODED=$(echo "$GDRIVE_OAUTH2" | base64 -d)
          CID=$(echo "$DECODED" | cut -d'|' -f1); RT=$(echo "$DECODED" | cut -d'|' -f2)
          echo "::add-mask::$CID"; echo "::add-mask::$RT"
          AT=$(curl -s -X POST https://oauth2.googleapis.com/token -d client_id="$CID" -d refresh_token="$RT" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          [ -n "$AT" ] && [ "$AT" != "null" ] || { echo "::error::Nu s-a putut obtine accesul la Google Drive."; exit 1; }
          API=https://www.googleapis.com/drive/v3/files
          FOLDER="mimeType='application/vnd.google-apps.folder' and trashed=false"
          find_or_create() { # $1=nume $2=parinte
            local ID=$(curl -s -G -H "Authorization: Bearer $AT" --data-urlencode "q=name='$1' and '$2' in parents and $FOLDER" --data-urlencode "fields=files(id)" $API | jq -r '.files[0].id')
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              ID=$(curl -s -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" -d "{\"name\":\"$1\",\"mimeType\":\"application/vnd.google-apps.folder\",\"parents\":[\"$2\"]}" $API | jq -r .id)
            fi
            echo "$ID"
          }
          ROOT=$(find_or_create "$DEST" "root")
          XD=$(find_or_create "xDrip" "$ROOT")
          VER=$(find_or_create "$LATEST" "$XD")
          CODE=$(curl -s -w "%{http_code}" -o resp.json -X POST -H "Authorization: Bearer $AT" \
            -F "metadata={\"name\":\"$NAME\",\"parents\":[\"$VER\"]};type=application/json;charset=UTF-8" \
            -F "file=@$NAME;type=application/vnd.android.package-archive" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart")
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then echo "::error::Upload esuat ($CODE)"; cat resp.json; exit 1; fi
          echo "Urcat in Google Drive: $DEST/xDrip/$LATEST/$NAME"
          curl -s -G -H "Authorization: Bearer $AT" \
            --data-urlencode "q='$XD' in parents and $FOLDER" \
            --data-urlencode "fields=files(id,name,createdTime)" --data-urlencode "orderBy=createdTime desc" \
            $API > folders.json
          jq -r --argjson k "$KEEP" '.files[$k:][] | "\(.id) \(.name)"' folders.json | while read -r ID FNAME; do
            curl -s -X PATCH -H "Authorization: Bearer $AT" -H "Content-Type: application/json" -d '{"trashed":true}' "$API/$ID" > /dev/null
            echo "Mutat in Cosul de gunoi: $DEST/xDrip/$FNAME"
          done

      - name: Memoreaza versiunea salvata
        if: steps.check.outputs.new == 'true'
        run: gh variable set XDRIP_LAST_BUILT -R "$REPO" --body "${{ steps.check.outputs.latest }}"
